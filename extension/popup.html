<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="theme-dark">
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon-wrapper">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="#1DB954" stroke-width="2"/>
            <path d="M8 14V10" stroke="#1ed760" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 16V8" stroke="#1ed760" stroke-width="2" stroke-linecap="round"/>
            <path d="M16 13V11" stroke="#1ed760" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">Spotify Companion</h1>
          <span class="brand-subtitle">Web Player Controller</span>
        </div>
      </div>

      <div class="header-actions">
        <div id="connectionStatus" class="status-badge disconnected" title="Connection status">
          <span class="status-dot"></span>
          <span class="status-label">Disconnected</span>
        </div>
        <button id="btnOpenOptions" class="icon-btn" aria-label="Open Extension Settings" title="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Notification Toast -->
    <div id="toastNotification" class="toast-notification hidden" role="alert" aria-live="polite">
      <span id="toastMessage"></span>
    </div>

    <!-- Spotify Disconnected Banner (Shown when no active tab found) -->
    <div id="disconnectedBanner" class="banner-card hidden">
      <div class="banner-icon-area">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1DB954" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div class="banner-content">
        <h2 class="banner-title">Spotify Web Player Not Detected</h2>
        <p class="banner-desc">Open open.spotify.com in Chrome to enable live playback controls and companion stats.</p>
        <button id="btnLaunchSpotify" class="btn btn-primary btn-sm">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M5 3l14 9-14 9V3z"/>
          </svg>
          Open Spotify Web Player
        </button>
      </div>
    </div>

    <!-- Main Widget Container -->
    <main id="widgetsContainer" class="widgets-area">
      <!-- Widgets will be rendered here dynamically based on settings -->
    </main>

    <!-- Empty Widgets State -->
    <div id="emptyWidgetsState" class="empty-state hidden">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <p class="empty-text">All dashboard widgets are currently disabled.</p>
      <button id="btnConfigureWidgets" class="btn btn-secondary btn-sm">Customize Widgets</button>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      <span class="footer-note">Independent Companion Extension &bull; v1.0.0</span>
      <button id="btnRefreshStatus" class="link-btn" title="Refresh status">Sync Now</button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
